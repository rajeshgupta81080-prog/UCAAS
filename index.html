<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UCAAS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="shared/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="shared/css/tokens.css" />
    <link rel="stylesheet" href="shared/css/topbar.css" />
    <link rel="stylesheet" href="shared/css/stage.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <!-- ============ THE ONE TOP BAR (from Company Rules) — shown on every section ============ -->
    <header class="topbar" id="topbar">
      <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a class="logo" href="#/dashboard" aria-label="UCAAS home"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="17" cy="14" r="2.4" fill="currentColor" stroke="none"/><path d="M12.5 9.5a6.5 6.5 0 0 0 0 9M21.5 9.5a6.5 6.5 0 0 1 0 9M8.5 6.5a12 12 0 0 0 0 15M25.5 6.5a12 12 0 0 1 0 15M17 18v10"/></svg></a>
      <nav class="nav" aria-label="Main">
        <a href="#/dashboard" data-section="dashboard"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></a>
        <a href="#/directory" data-section="directory"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.5-2.5 3.2-3.5 5.5-3.5s4 1 5.5 3.5"/></svg><span>Directory</span></a>
        <a href="#/interactions" data-section="interactions"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span>Interactions</span></a>
        <a href="#/analytics" data-section="analytics"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Analytics</span></a>
        <a href="#/settings" data-section="settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-5.5 7-5.5"/><circle cx="18" cy="17" r="2.2"/><path d="M18 13.8v.6M18 19.6v.6M21.2 17h-.6M15.4 17h-.6"/></svg><span>Settings</span></a>
        <div class="nav-sep"></div>
      </nav>
      <label class="search" id="topSearch"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="topSearchInput" placeholder="Search here..." autocomplete="off" aria-label="Search here" role="combobox" aria-expanded="false" aria-controls="searchPanel" /><kbd>Ctrl K</kbd>
        <div class="panel" id="searchPanel" role="listbox" hidden></div>
      </label>
      <div class="spacer"></div>
      <div class="notif-wrap">
        <button type="button" class="icon-btn" id="bellBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge-count" id="bellBadge">0</span></button>
        <div class="panel" id="notifPanel" hidden></div>
      </div>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <div class="pill"><span style="color:var(--primary);display:flex"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span id="clock">--:--:--</span> <small id="tz">GMT</small></div>
      <div class="pill blue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1"/></svg>$89.82</div>
      <button type="button" class="pill duty" id="dutyPill"><i></i><span class="dl">On duty </span><span style="font-weight:500" id="duty">219:12:30</span></button>
      <div class="notif-wrap" id="profileWrap">
        <button type="button" class="avatar" id="avatarBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account and role">JD</button>
        <div class="panel" id="profilePanel" hidden></div>
      </div>
    </header>

    <!-- ============ SECTION HOST ============ -->
    <main class="stage" id="stage">
      <div class="stage-loading" id="loading"><div class="spinner" role="status" aria-label="Loading"></div></div>
      <iframe id="view" title="Section content" allow="camera; microphone; display-capture; autoplay; clipboard-read; clipboard-write; fullscreen; picture-in-picture"></iframe>
    </main>
    <div class="lock" id="lockScreen" role="alertdialog" aria-labelledby="lockTitle" aria-describedby="lockMsg" hidden>
      <div class="lock-card"><h2 id="lockTitle">Signed out for inactivity</h2><p id="lockMsg"></p><button type="button" id="lockResume">Resume</button></div>
    </div>
    <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

    <script src="shared/js/config.js"></script>
    <script src="shared/js/theme.js"></script>
    <script src="shared/js/bus.js"></script>
    <script src="shared/js/policies.js"></script>
    <script src="shared/js/clock.js"></script>
    <script src="shared/js/duty.js"></script>
    <script src="shared/js/toast.js"></script>
    <script src="shared/js/notifications.js"></script>
    <script src="shared/js/roles.js"></script>
    <script src="shared/js/search.js"></script>
    <script src="shared/js/router.js"></script>
    <script src="shared/js/main.js"></script>
  </body>
</html>
