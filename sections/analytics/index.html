<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../shared/js/embed-bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCM Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/embed.css" />
</head>
<body>
<header class="top">
  <svg class="logo" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="19" r="3.2" fill="currentColor"/><path d="M24 23v20M16 11a11 11 0 0 0 0 16M32 11a11 11 0 0 1 0 16M10 6a19 19 0 0 0 0 26M38 6a19 19 0 0 1 0 26"/><path d="M19 43h10" stroke="#26c6da"/></svg>
  <nav class="tnav" id="tnav"></nav>
  <span class="vsep"></span>
  <label class="search" id="searchBox"><svg class="i" style="width:1.25rem;height:1.25rem" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input placeholder="Search here..." readonly><kbd>Ctrl K</kbd></label>
  <div class="sp"></div>
  <button class="sqbtn" id="bell" title="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg><span class="badge hide" id="bellBadge">0</span></button>
  <button class="sqbtn" id="theme" title="Toggle dark mode"><svg class="i" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
  <div class="pill clock"><svg class="i" style="color:var(--brand);width:1.3125rem;height:1.3125rem" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="clock">--:--:--</span></div>
  <div class="pill wallet" title="Prepaid balance (set in Settings)"><svg class="i" style="width:1.75rem;height:1.75rem" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M3 6l2-3h10v3M16 15h2"/></svg><span id="wallet">$0.00</span></div>
  <button class="pill duty" id="dutyPill" title="Click to go on / off duty"><span class="dot"></span>On duty <span class="t" id="duty">0:00:00</span></button>
  <button class="avatar" id="avatar" title="Account and role"></button>
</header>
<div class="wrap">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main class="main"><div class="fbar" id="fbar"></div><div class="view" id="view"></div></main>
</div>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/drill.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/queues.js"></script>
<script src="js/pages/agents.js"></script>
<script src="js/pages/calls.js"></script>
<script src="js/pages/flows.js"></script>
<script src="js/pages/boards.js"></script>
<script src="js/pages/live.js"></script>
<script src="js/pages/monitoring.js"></script>
<script src="js/pages/callbacks.js"></script>
<script src="js/pages/campaigns.js"></script>
<script src="js/pages/aiwall.js"></script>
<script src="js/pages/speech.js"></script>
<script src="js/pages/quality.js"></script>
<script src="js/pages/coaching.js"></script>
<script src="js/pages/activity.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/wfm.js"></script>
<script src="js/pages/alerts.js"></script>
<script src="js/pages/settings.js"></script>
<script>MCM.boot();</script>
<script src="js/role.js"></script>
<script src="js/link.js"></script>
</body>
</html>
